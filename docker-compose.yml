version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectmgmt-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ProjectManagementDB;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__SecretKey=YourSuperSecretKeyThatIsAtLeast32CharactersLong!DockerVersion
      - JwtSettings__Issuer=ProjectManagementAPI
      - JwtSettings__Audience=ProjectManagementAPIUsers
      - JwtSettings__ExpiryInMinutes=60
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - projectmgmt-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: projectmgmt-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - projectmgmt-net

  redis:
    image: redis:7-alpine
    container_name: projectmgmt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - projectmgmt-net

volumes:
  sqlserver_data:
  redis_data:

networks:
  projectmgmt-net:
    driver: bridge
